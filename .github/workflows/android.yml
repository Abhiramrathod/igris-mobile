name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"

      - name: Build debug and release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: igris-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: igris-mobile-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

  release:
    name: Release & Email
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Prepare release files
        run: |
          mv "apks/igris-mobile-release-apk/app-release.apk" "IgrisMobile-${{ github.ref_name }}.apk"
          mv "apks/igris-mobile-debug-apk/app-debug.apk" "IgrisMobile-${{ github.ref_name }}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            IgrisMobile-${{ github.ref_name }}.apk
            IgrisMobile-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Send release email
        if: env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        uses: appleboy/smtp-action@v1
        with:
          server: smtp.gmail.com
          port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: IGRIS Mobile CI <${{ secrets.MAIL_USERNAME }}>
          to: abhiramrathod21@gmail.com
          subject: "[IGRIS Mobile] New release ${{ github.ref_name }}"
          html_body: |
            <div style="font-family: Arial, sans-serif; background:#08080A; padding:24px; color:#D4D0C8;">
              <h2 style="color:#C8A24E;">&#9670; IGRIS Mobile ${{ github.ref_name }} &mdash; New Release</h2>
              <p>A new build of <b>IGRIS Mobile</b> has been published.</p>
              <p>Version: <b>${{ github.ref_name }}</b><br/>
              Commit: <code>${{ github.sha }}</code><br/>
              Release: <a href="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" style="color:#E4C06A;">View on GitHub</a></p>
              <p>The release APK is attached to this email.</p>
              <p style="color:#5A5854; font-size:12px;">Sent automatically by the IGRIS Mobile CI pipeline.</p>
            </div>
          attachments: "IgrisMobile-${{ github.ref_name }}.apk"
